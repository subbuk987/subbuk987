name: stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Draw stats card
        # Skip quietly until the STATS_TOKEN secret exists, instead of failing every day.
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "STATS_TOKEN not set; skipping"; exit 0; fi
          python scripts/stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet || (git commit -m "chore: refresh stats" && git push)
